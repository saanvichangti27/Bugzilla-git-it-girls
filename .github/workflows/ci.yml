name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Build Frontend
      working-directory: ./frontend
      run: |
        npm ci || npm install
        npm run build

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Test Backend
      working-directory: ./backend
      run: |
        pip install -r requirements.txt
        pip install pytest httpx
        pytest tests/
